name: decode-pdf
on:
  push:
    branches: [main]
    paths:
      - 'incoming-pdf/*.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode incoming base64 to PDF
        run: |
          shopt -s nullglob
          mkdir -p whitepapers
          for f in incoming-pdf/*.b64; do
            n=$(basename "$f" .b64)
            base64 -d "$f" > "whitepapers/$n.pdf"
            git rm -q "$f"
            git add "whitepapers/$n.pdf"
          done
      - name: Commit and push
        run: |
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Decode whitepaper PDFs"
          git pull --rebase origin main
          git push origin HEAD:main
